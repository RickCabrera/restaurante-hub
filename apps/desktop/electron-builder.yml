# Configuración de electron-builder para Restaurante Hub (escritorio).
# Se ejecuta sobre una carpeta "stage" generada por scripts/package.mjs (pnpm deploy con
# node_modules planos), porque electron-builder no resuelve bien los enlaces de un workspace pnpm.
appId: mx.restaurantehub.desktop
productName: Restaurante Hub
executableName: RestauranteHub
copyright: Copyright © 2026 Restaurante Hub
artifactName: RestauranteHub-Setup-${version}.${ext}

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - src/setup/index.html
  - src/setup/setup.js
  - resources/**
  - package.json
  - node_modules/**
  - "!**/*.map"
  - "!**/*.ts"
  - "!node_modules/**/{test,tests,__tests__,docs,example,examples}/**"
  - "!node_modules/@rh/*/src/**"
  - "!node_modules/@rh/print-agent/deploy/**"

# El script PowerShell de impresión RAW se escribe a %TEMP% en tiempo de ejecución, así que
# no hace falta desempacarlo; los binarios nativos opcionales (serialport) sí.
asarUnpack:
  - "**/*.node"
  - "node_modules/@serialport/**"

# serialport usa prebuilds N-API compatibles con Electron: no recompilar.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  publisherName: Restaurante Hub

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Restaurante Hub
  runAfterFinish: true
  installerLanguages: [es_MX, es_ES]
  language: "2058"
  multiLanguageInstaller: false
  deleteAppDataOnUninstall: false

linux:
  target: [AppImage]
  artifactName: RestauranteHub-${version}.${ext}
  category: Office
  icon: build/icon.png
  maintainer: Restaurante Hub

# Sin publicación por defecto (el .exe se adjunta al Release desde CI).
# Para habilitar auto-actualización, descomenta y ajusta:
# publish:
#   provider: github
#   owner: TU_USUARIO
#   repo: restaurante-hub
publish: null
